name: Build Socratus Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

jobs:
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Install workspace deps (ebook-reader web app)
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Build the Vite web app for Electron (no PORT/BASE_PATH needed)
      - name: Build web app
        working-directory: artifacts/ebook-reader
        run: pnpm vite build --config vite.config.desktop.ts

      # Install Electron and electron-builder (desktop package is standalone)
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      # Compile TypeScript Electron main process
      - name: Compile Electron main
        working-directory: desktop
        run: npx tsc -p tsconfig.json

      # Package with electron-builder (platform-specific)
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        working-directory: desktop
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        working-directory: desktop
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload installers as release assets
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Socratus-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: warn
          retention-days: 30
